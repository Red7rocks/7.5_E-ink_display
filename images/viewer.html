<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Preview</title>
  <style>
    body { background: #222; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    img { max-width: 95vw; max-height: 95vh; border: 4px solid #444; }
  </style>
</head>
<body>
  <img id="preview" src="dashboard_preview.png">
  <script>
    // poll and cache-bust every 2s so you see updates without a manual reload
    setInterval(() => {
      document.getElementById('preview').src = 'dashboard_preview.png?t=' + Date.now();
    }, 2000);
  </script>
</body>
</html>
